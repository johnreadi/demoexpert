version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: demoexpert_local
    volumes:
      - db_data_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://admin:password@db:5432/demoexpert_local
      SESSION_SECRET: local_dev_secret
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: "1"
      SEED_DB: "true"
    ports:
      - "3000:3000"
    depends_on:
      - db
    links:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
        VITE_USE_LOCAL_API: "false"
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data_local:
