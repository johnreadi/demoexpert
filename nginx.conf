server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ================= HEADERS ANTI-CACHE =================
    # TOUTES les réponses auront ces headers
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # ================= LOCATIONS =================
    
    # HTML files - JAMAIS en cache
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
    
    # JS/CSS files - pas de cache
    location ~* \.(js|css|tsx)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }
    
    # Images - cache court
    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    
    # Health check endpoint
    location = /health.txt {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "healthy\n";
    }
    
    # Proxy API vers le backend (fallback si VITE_API_BASE_URL pointe vers /api)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Tout le reste - SPA routing
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
