server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # ================= HEADERS ANTI-CACHE =================
    # TOUTES LES RÉPONSES auront ces headers
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Surrogate-Control "no-store" always;
    
    # ================= CONFIGURATION SPÉCIFIQUE =================
    
    # 1. FICHIERS HTML - JAMAIS CACHÉS (le plus critique)
    location ~* \.html$ {
        # Headers renforcés
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-HTML-No-Cache "true" always;
        
        try_files $uri $uri/ /index.html;
    }
    
    # 2. FICHIERS AVEC HASH (ex: main-abc123.js) - CACHE LONG
    location ~* "-[a-f0-9]{8,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }
    
    # 3. AUTRES FICHIERS STATIQUES
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
    
    # 4. HEALTH CHECK (pour Dokploy)
    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "healthy";
    }
    
    # 5. SERVICE WORKER - DÉSACTIVER
    location ~* (service-worker\.js|sw\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 404;
    }
    
    # 6. ROUTE SPA (React Router)
    location / {
        # Aucun cache pour les routes SPA
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
    
    # ================= OPTIONS GÉNÉRALES =================
    client_max_body_size 10M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
