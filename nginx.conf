server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ================= HEADERS ANTI-CACHE =================
    # Headers pour TOUTES les réponses
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    
    # Headers de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    # ================= LOCATIONS SPÉCIFIQUES =================
    
    # 1. FICHIERS HTML - JAMAIS EN CACHE
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
    
    # 2. FICHIERS JS/CSS SANS HASH - AUCUN CACHE
    location ~* \.(js|css)$ {
        # Si pas de hash dans le nom, pas de cache
        if ($uri !~ "-[a-f0-9]{8,}\.(js|css)$") {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
        }
        # Avec hash, cache long
        if ($uri ~ "-[a-f0-9]{8,}\.(js|css)$") {
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            expires 1y;
        }
        try_files $uri =404;
    }
    
    # 3. IMAGES, FONTS - CACHE MODÉRÉ
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        expires 30d;
        try_files $uri =404;
    }
    
    # 4. HEALTH CHECK
    location = /health.txt {
        access_log off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    
    # 5. SERVICE WORKER - BLOQUER
    location ~* (service-worker\.js|sw\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 404;
    }
    
    # 6. ROUTE PAR DÉFAUT (SPA)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
    
    # ================= OPTIONS =================
    client_max_body_size 10M;
    sendfile on;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
