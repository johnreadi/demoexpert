# docker-compose.agria.yml - Version FINALE (sans warnings)
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: demoexpert
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - dokploy-overlay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d demoexpert"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Use provided DATABASE_URL (Dokploy/Production) or fallback to local db service
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@db:5432/demoexpert}
      SESSION_SECRET: ${SESSION_SECRET:-supersecret}
      # CORS: Allow frontend origin or * for development
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-overlay
    # Diagnostic command: verify build presence and start server.
    # Keep container alive if npm start fails to allow log inspection.
    # Fallback server prevents 502 Bad Gateway and allows error reporting.
    command: >
      sh -c "echo '--- CONTAINER START ---' && 
      (npx prisma migrate deploy || echo '--- MIGRATION FAILED (CONTINUING) ---') && 
      ls -la dist/ && 
      (npm start || echo '--- NPM START FAILED ---'); 
       echo '--- STARTING FALLBACK SERVER ---'; 
       node -e 'const http=require("http");const port=process.env.PORT||3000;console.log("Starting fallback on "+port);http.createServer((req,res)=>{console.log("Fallback req: "+req.url);const origin=req.headers.origin||"*";res.writeHead(503,{"Content-Type":"application/json","Access-Control-Allow-Origin":origin,"Access-Control-Allow-Credentials":"true"});res.end(JSON.stringify({error:"backend_crashed",status:503,message:"The backend server failed to start. Please check container logs."}));}).listen(port,"0.0.0.0",()=>{console.log("Fallback server running on "+port)});' || echo '--- FALLBACK SERVER FAILED ---'; 
       sleep 3600"
    
    # 🔧 UNIQUEMENT les labels "service" (pas de "router" pour éviter les conflits)
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
    
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-overlay
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app.loadbalancer.server.port=80"

networks:
  dokploy-overlay:
    external: true

volumes:
  db_data:
