version: '3.8'

services:
  # Restore Local DB Service to recover data from volume
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      # Use credentials matching the suspected correct DB (Dokploy default)
      POSTGRES_DB: demoexpert-expertdb-djopvt
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: dokploy
    networks:
      - dokploy-overlay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokploy -d demoexpert-expertdb-djopvt"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Ensure connection to the correct Dokploy database via internal network
      DATABASE_URL: ${DATABASE_URL:-postgresql://dokploy:dokploy@demoexpert-expertdb-djopvt:5432/demoexpert-expertdb-djopvt}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "false"
    networks:
      - dokploy-overlay
      # Explicitly add dokploy-network to ensure Traefik connectivity
      - dokploy-network
    command: node dist/index.js
    
    # 🔧 UNIQUEMENT les labels "service" (pas de "router" pour éviter les conflits)
    labels:
      - "traefik.enable=true"
      # Use dokploy-network for Traefik ingress (standard)
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 180s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-overlay
      # Explicitly add dokploy-network to ensure Traefik connectivity
      - dokploy-network
    
    labels:
      - "traefik.enable=true"
      # Use dokploy-network for Traefik ingress (standard)
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.app.loadbalancer.server.port=80"

networks:
  dokploy-overlay:
    external: true
  dokploy-network:
    external: true

volumes:
  db_data:
    external: true
    name: demoexpert-expertdb-djopvt-data
