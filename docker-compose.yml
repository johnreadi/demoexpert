# docker-compose.agria.yml - Version standardisée
version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-none}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
    networks:
      - dokploy-overlay
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm start"

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_USE_LOCAL_API: "false"
    networks:
      - dokploy-overlay
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demoexpert.rule=Host(`app.demoexpert.fr`)"
      - "traefik.http.routers.demoexpert.entrypoints=websecure"
      - "traefik.http.routers.demoexpert.tls.certresolver=letsencrypt"
      - "traefik.http.services.demoexpert.loadbalancer.server.port=80"
      - "traefik.http.routers.demoexpert.middlewares=demoexpert-api"
      - "traefik.http.middlewares.demoexpert-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.demoexpert-api.rule=Host(`app.demoexpert.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.demoexpert-api.entrypoints=websecure"
      - "traefik.http.routers.demoexpert-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.demoexpert-api.service=demoexpert-api"
      - "traefik.http.services.demoexpert-api.loadbalancer.server.port=8080"

networks:
  dokploy-overlay:
    external: true
