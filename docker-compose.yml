# docker-compose.agria.yml - Version FINALE (sans warnings)
version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "false"
    networks:
      - dokploy-overlay
    command: sh -c "npx prisma migrate deploy || true && npx prisma generate || true && npm start"
    
    # 🔧 UNIQUEMENT les labels "service" (pas de "router" pour éviter les conflits)
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 180s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-overlay
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app.loadbalancer.server.port=80"

networks:
  dokploy-overlay:
    external: true
