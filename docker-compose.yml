# docker-compose.agria.yml - Version SANS CONFLIT
version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000  # 🔥 FORCÉ à 3000 (votre code fallback à 8080 sinon)
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "false"
    networks:
      - dokploy-overlay
    command: sh -c "npx prisma migrate deploy || true && npx prisma generate || true && npm start"
    
    # 🔧 UNIQUEMENT les labels "service" (pas de "router" !)
    labels:
      - "traefik.enable=true"
      # Port interne du container (CRUCIAL - non géré par Dokploy)
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      # Healthcheck pour Traefik (optionnel mais recommandé)
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.backend.loadbalancer.healthcheck.timeout=10s"
    
    # 🔧 Healthcheck Docker avec Node (universel)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 180s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-overlay
    
    # 🔧 UNIQUEMENT les labels "service" pour l'app frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app.loadbalancer.server.port=80"
      - "traefik.http.services.app.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.app.loadbalancer.healthcheck.interval=30s"

networks:
  dokploy-overlay:
    external: true
