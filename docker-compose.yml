version: '3.8'

services:
  # ❌ Removed temporary DB service. 
  # We will use the existing managed DB service (demoexpert-expertdb-djopvt) which is running Postgres 18.

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Ensure connection to the correct Dokploy database via internal network
      DATABASE_URL: ${DATABASE_URL:-postgresql://dokploy:dokploy@demoexpert-expertdb-djopvt:5432/demoexpert-expertdb-djopvt}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "false"
      SEED_DB: "true"
    networks:
      - dokploy-overlay
      # Removing dokploy-network to force single-interface communication via overlay
      # - dokploy-network
    command: node dist/index.js
    
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-overlay"
      # Router pour api.demoexpert.fr
      - "traefik.http.routers.backend.rule=Host(`api.demoexpert.fr`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.service=backend"
      # Service
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    restart: unless-stopped
    networks:
      - dokploy-overlay
    
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-overlay"
      # Router pour app.demoexpert.fr
      - "traefik.http.routers.app.rule=Host(`app.demoexpert.fr`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app.service=app"
      # Service
      - "traefik.http.services.app.loadbalancer.server.port=80"

networks:
  dokploy-overlay:
    external: true
  dokploy-network:
    external: true

volumes:
  db_data:
    external: true
    name: demoexpert-expertdb-djopvt-data
