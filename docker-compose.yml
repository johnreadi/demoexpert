# docker-compose.agria.yml - Version ULTRA-SIMPLIFIÉE
version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000  # 🔥 FORCÉ à 3000, pas de fallback
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
    networks:
      - dokploy-network
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm start"
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.demoexpert.fr`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      # Healthcheck Traefik pointant sur /healthz
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
    
    # 🔧 Healthcheck TCP simple (pas besoin de route HTTP)
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/3000' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 180s  # 🔥 3 minutes pour Prisma + démarrage

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    restart: unless-stopped
    # 🔧 TEMPORAIRE : retirer la dépendance healthy pour débloquer
    # depends_on:
    #   backend:
    #     condition: service_started
    networks:
      - dokploy-network
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.demoexpert.fr`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
