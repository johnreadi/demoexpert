version: '3.8'

# Configuration pour éviter les conflits d'endpoint Docker Swarm
# Mode "compose" plutôt que "stack" pour plus de fiabilité

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: demoexpert-api:latest
    container_name: demoexpert-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Ensure connection to the correct Dokploy database via internal network
      DATABASE_URL: ${DATABASE_URL:-postgresql://dokploy:dokploy@${DB_HOST:-demoexpert-expertdb-djopvt-kgplzz}:5432/${DB_NAME:-demoexpert-expertdb-djopvt}}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "false"
      SEED_DB: "true"
    networks:
      - traefik-network
      - dokploy-overlay
    
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      # Router pour api.demoexpert.fr
      - "traefik.http.routers.demoexpert-api.rule=Host(`api.demoexpert.fr`)"
      - "traefik.http.routers.demoexpert-api.entrypoints=websecure"
      - "traefik.http.routers.demoexpert-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.demoexpert-api.service=demoexpert-api"
      # Service — PAS de healthcheck Traefik (Docker healthcheck suffit)
      - "traefik.http.services.demoexpert-api.loadbalancer.server.port=3000"
      # Security headers
      - "traefik.http.middlewares.demoexpert-api-security.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.demoexpert-api-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.demoexpert-api-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.demoexpert-api-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.demoexpert-api-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.demoexpert-api-security.headers.stsPreload=true"
      - "traefik.http.routers.demoexpert-api.middlewares=demoexpert-api-security"
    
    # Security: Limit container capabilities
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    image: demoexpert-app:latest
    container_name: demoexpert-app
    restart: unless-stopped
    # Security: Limit container capabilities (nginx needs write access)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
    networks:
      - traefik-network
    
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      # Router pour app.demoexpert.fr
      - "traefik.http.routers.demoexpert-app.rule=Host(`app.demoexpert.fr`)"
      - "traefik.http.routers.demoexpert-app.entrypoints=websecure"
      - "traefik.http.routers.demoexpert-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.demoexpert-app.service=demoexpert-app"
      # Service
      - "traefik.http.services.demoexpert-app.loadbalancer.server.port=80"
      # Security headers
      - "traefik.http.middlewares.demoexpert-app-security.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.demoexpert-app-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.demoexpert-app-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.demoexpert-app-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.demoexpert-app-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.demoexpert-app-security.headers.stsPreload=true"
      - "traefik.http.routers.demoexpert-app.middlewares=demoexpert-app-security"

networks:
  traefik-network:
    external: true
  dokploy-overlay:
    external: true

volumes:
  db_data:
    external: true
    name: demoexpert-expertdb-djopvt-data
