version: '3.8'

# Configuration pour éviter les conflits d'endpoint Docker Swarm
# Mode "compose" plutôt que "stack" pour plus de fiabilité

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: demoexpert-api:latest
    container_name: demoexpert-api-v2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Ensure connection to the correct Dokploy database via internal network
      DATABASE_URL: ${DATABASE_URL:-postgresql://dokploy:dokploy@${DB_HOST:-demoexpert-expertdb-djopvt-kgplzz}:5432/${DB_NAME:-demoexpert-expertdb-djopvt}}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "true"
      SEED_DB: "true"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.demoexpert-api-web.rule=Host(`api.demoexpert.fr`)
      - traefik.http.routers.demoexpert-api-web.entrypoints=web
      - traefik.http.routers.demoexpert-api-web.middlewares=redirect-to-https@file
      - traefik.http.routers.demoexpert-api-web.service=demoexpert-api-web
      - traefik.http.routers.demoexpert-api-websecure.rule=Host(`api.demoexpert.fr`)
      - traefik.http.routers.demoexpert-api-websecure.entrypoints=websecure
      - traefik.http.routers.demoexpert-api-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.demoexpert-api-websecure.service=demoexpert-api-websecure
      - traefik.http.services.demoexpert-api-web.loadbalancer.server.port=3000
      - traefik.http.services.demoexpert-api-websecure.loadbalancer.server.port=3000
    
    # Security: Limit container capabilities
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    image: demoexpert-app:latest
    container_name: demoexpert-app
    restart: unless-stopped
    # Security: Limit container capabilities (nginx needs write access)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    external: true
    name: demoexpert-expertdb-djopvt-data
