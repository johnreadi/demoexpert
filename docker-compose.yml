version: '3.8'

services:
  # ❌ Removed temporary DB service. 
  # We will use the existing managed DB service (demoexpert-expertdb-djopvt) which is running Postgres 18.

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Ensure connection to the correct Dokploy database via internal network
      DATABASE_URL: ${DATABASE_URL:-postgresql://dokploy:dokploy@${DB_HOST:-demoexpert-expertdb-djopvt-kgplzz}:5432/${DB_NAME:-demoexpert-expertdb-djopvt}}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "false"
      SEED_DB: "true"
    networks:
      - dokploy-network
      - dokploy-overlay
    
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-dokploy-network}"
      # Router pour api.demoexpert.fr
      - "traefik.http.routers.demoexpert-backend.rule=Host(`api.demoexpert.fr`)"
      - "traefik.http.routers.demoexpert-backend.entrypoints=websecure"
      - "traefik.http.routers.demoexpert-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.demoexpert-backend.service=demoexpert-backend"
      - "traefik.http.routers.demoexpert-backend.middlewares=demoexpert-backend-cors"
      # Middleware CORS (headers pour toutes les requêtes incluant preflight)
      - "traefik.http.middlewares.demoexpert-backend-cors.headers.accesscontrolalloworiginlist=https://app.demoexpert.fr,https://demoexpert.fr"
      - "traefik.http.middlewares.demoexpert-backend-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH"
      - "traefik.http.middlewares.demoexpert-backend-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,X-Requested-With,Cookie"
      - "traefik.http.middlewares.demoexpert-backend-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.demoexpert-backend-cors.headers.accesscontrolmaxage=86400"
      - "traefik.http.middlewares.demoexpert-backend-cors.headers.addvaryheader=true"
      # Service — PAS de healthcheck Traefik (Docker healthcheck suffit)
      - "traefik.http.services.demoexpert-backend.loadbalancer.server.port=3000"
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    restart: unless-stopped
    networks:
      - dokploy-network
      - dokploy-overlay
    
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-dokploy-network}"
      # Router pour app.demoexpert.fr
      - "traefik.http.routers.demoexpert-app.rule=Host(`app.demoexpert.fr`)"
      - "traefik.http.routers.demoexpert-app.entrypoints=websecure"
      - "traefik.http.routers.demoexpert-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.demoexpert-app.service=demoexpert-app"
      # Service
      - "traefik.http.services.demoexpert-app.loadbalancer.server.port=80"

networks:
  dokploy-overlay:
    external: true
  dokploy-network:
    external: true

volumes:
  db_data:
    external: true
    name: demoexpert-expertdb-djopvt-data
