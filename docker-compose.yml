# docker-compose.agria.yml - Version standardisée
version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-none}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
    networks:
      - dokploy-overlay
      - dokploy-network
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm start"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${PORT:-8080} || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 45s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: https://api.demoexpert.fr
      VITE_USE_LOCAL_API: "false"
    networks:
      - dokploy-overlay
      - dokploy-network

networks:
  dokploy-overlay:
    external: true
  dokploy-network:
    external: true
