name: demoexpert-casseauto-bckdiq
version: '3.8'

# Configuration pour éviter les conflits d'endpoint Docker Swarm
# Mode "compose" plutôt que "stack" pour plus de fiabilité

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: demoexpert-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      # Database is now managed inside this docker-compose stack
      DATABASE_URL: postgresql://dokploy:dokploy@db:5432/demoexpert-expertdb-djopvt
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.demoexpert.fr}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@demoexpert.fr}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-demo76000}
      STRICT_DB: "true"
      SEED_DB: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-overlay
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-overlay
      - traefik.http.routers.demoexpert-api-web.rule=Host(`api.demoexpert.fr`)
      - traefik.http.routers.demoexpert-api-web.entrypoints=web
      - traefik.http.routers.demoexpert-api-web.priority=100
      - traefik.http.routers.demoexpert-api-web.middlewares=redirect-to-https@file
      - traefik.http.routers.demoexpert-api-web.service=demoexpert-api-web
      - traefik.http.routers.demoexpert-api-websecure.rule=Host(`api.demoexpert.fr`)
      - traefik.http.routers.demoexpert-api-websecure.entrypoints=websecure
      - traefik.http.routers.demoexpert-api-websecure.priority=100
      - traefik.http.routers.demoexpert-api-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.demoexpert-api-websecure.service=demoexpert-api-websecure
      - traefik.http.services.demoexpert-api-web.loadbalancer.server.port=8080
      - traefik.http.services.demoexpert-api-websecure.loadbalancer.server.port=8080

      - traefik.http.routers.demoexpert-api-app-web.rule=Host(`app.demoexpert.fr`) && PathPrefix(`/api`)
      - traefik.http.routers.demoexpert-api-app-web.entrypoints=web
      - traefik.http.routers.demoexpert-api-app-web.priority=200
      - traefik.http.routers.demoexpert-api-app-web.middlewares=redirect-to-https@file
      - traefik.http.routers.demoexpert-api-app-web.service=demoexpert-api-web
      - traefik.http.routers.demoexpert-api-app-websecure.rule=Host(`app.demoexpert.fr`) && PathPrefix(`/api`)
      - traefik.http.routers.demoexpert-api-app-websecure.entrypoints=websecure
      - traefik.http.routers.demoexpert-api-app-websecure.priority=200
      - traefik.http.routers.demoexpert-api-app-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.demoexpert-api-app-websecure.service=demoexpert-api-websecure
    
    # Security: Limit container capabilities
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://api.demoexpert.fr/api
        VITE_USE_LOCAL_API: "false"
    image: demoexpert-app:latest
    restart: unless-stopped
    # Security: Limit container capabilities (nginx needs write access)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-overlay
      - traefik.http.routers.demoexpert-app-web.rule=Host(`app.demoexpert.fr`)
      - traefik.http.routers.demoexpert-app-web.entrypoints=web
      - traefik.http.routers.demoexpert-app-web.priority=100
      - traefik.http.routers.demoexpert-app-web.middlewares=redirect-to-https@file
      - traefik.http.routers.demoexpert-app-web.service=demoexpert-app-web
      - traefik.http.routers.demoexpert-app-websecure.rule=Host(`app.demoexpert.fr`)
      - traefik.http.routers.demoexpert-app-websecure.entrypoints=websecure
      - traefik.http.routers.demoexpert-app-websecure.priority=100
      - traefik.http.routers.demoexpert-app-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.demoexpert-app-websecure.service=demoexpert-app-websecure
      - traefik.http.services.demoexpert-app-web.loadbalancer.server.port=80
      - traefik.http.services.demoexpert-app-websecure.loadbalancer.server.port=80
    networks:
      - dokploy-overlay

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: dokploy
      POSTGRES_DB: demoexpert-expertdb-djopvt
      PGDATA: /var/lib/postgresql/data
    volumes:
      - demoexpert-expertdb-data:/var/lib/postgresql
    networks:
      - dokploy-overlay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokploy -d demoexpert-expertdb-djopvt"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  dokploy-overlay:
    external: true
    name: dokploy-overlay

volumes:
  demoexpert-expertdb-data:
