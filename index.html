<body>
    <!-- ANTI-CACHE NOTIFICATION (visible seulement en dev) -->
    <div id="cache-debug" style="position: fixed; top: 10px; right: 10px; background: #ff4444; color: white; padding: 5px 10px; border-radius: 3px; z-index: 9999; font-size: 12px; display: none;">
      🚫 Cache désactivé
    </div>

    <div id="root"></div>

    <!-- SCRIPT ANTI-CACHE ET ANTI-SERVICE-WORKER -->
    <script>
      (function() {
        console.log('🛡️  Initialisation protection anti-cache...');
        
        // Afficher le debug en dev
        if (window.location.hostname === 'localhost' || window.location.hostname.includes('127.0.0.1')) {
          document.getElementById('cache-debug').style.display = 'block';
        }
        
        // 1. VÉRIFICATION DE VERSION
        const DEPLOY_TIMESTAMP = '<!-- DEPLOY_TIMESTAMP -->';
        let STORED_TIMESTAMP = null;
        try { STORED_TIMESTAMP = localStorage.getItem('deploy_timestamp'); } catch {}
        const IS_PLACEHOLDER = DEPLOY_TIMESTAMP === '<!-- DEPLOY_TIMESTAMP -->';
    
        // Désinscription SW + purge caches (sans reload forcé)
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) { registration.unregister(); });
            if ('caches' in window) {
              caches.keys().then(function(cacheNames) {
                cacheNames.forEach(function(cacheName) { caches.delete(cacheName); });
              });
            }
          });
          const originalRegister = navigator.serviceWorker.register;
          navigator.serviceWorker.register = function() {
            return Promise.reject(new Error('Service Workers désactivés'));
          };
          navigator.serviceWorker.getRegistrations = function() { return Promise.resolve([]); };
        }
    
        // Nettoyage uniquement si vraie nouvelle version (sans reload automatique)
        if (!IS_PLACEHOLDER && STORED_TIMESTAMP && STORED_TIMESTAMP !== DEPLOY_TIMESTAMP) {
          try {
            const preserveKeys = ['user_token', 'user_preferences', 'language'];
            Object.keys(localStorage).forEach(function(key) {
              if (!preserveKeys.includes(key)) localStorage.removeItem(key);
            });
            sessionStorage.clear();
          } catch {}
          if (window.indexedDB && window.indexedDB.databases) {
            window.indexedDB.databases().then(function(databases) {
              databases.forEach(function(db) { indexedDB.deleteDatabase(db.name); });
            });
          }
          console.log('✅ Cache nettoyé (sans rechargement forcé)');
        }
    
        try { localStorage.setItem('deploy_timestamp', DEPLOY_TIMESTAMP); } catch {}
        try { localStorage.setItem('last_visit', new Date().toISOString()); } catch {}
    
        // Surveille les changements de route (aucun reload)
        let lastUrl = location.href;
        new MutationObserver(function() {
          const url = location.href;
          if (url !== lastUrl) {
            lastUrl = url;
            console.log('📍 Changement de route détecté (pas de reload forcé).');
          }
        }).observe(document, {subtree: true, childList: true});
        
        console.log('✅ Système anti-cache activé avec succès!');
        
      })();
    </script>

    <!-- SCRIPT PRINCIPAL DE L'APPLICATION -->
    <script type="module" src="/index.tsx?nocache=<!-- DEPLOY_TIMESTAMP -->"></script>
    
    <!-- FALLBACK SCRIPT SI TOUT ÉCHOUE -->
    <script>
      // Dernière ligne de défense
      setTimeout(function() {
        if (!window.__APP_LOADED__) {
          console.warn('⚠️  Application non chargée, forçage du rechargement...');
          window.location.href = window.location.pathname + '?force_reload=' + Date.now();
        }
      }, 3000);
      
      window.__APP_LOADED__ = false;
      window.addEventListener('load', function() {
        window.__APP_LOADED__ = true;
        console.log('✅ Application chargée avec succès');
      });
    </script>
